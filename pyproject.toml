[project]
name = "ha-health-hub"
version = "0.1.0"
description = "Cloud-free Fitbit-app replacement: Gadgetbridge band data in Home Assistant"
requires-python = ">=3.13"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
