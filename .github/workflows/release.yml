name: Release

# Publishes a release whenever the version in manifest.json is one that hasn't
# been released yet: HACS installs the integration from it, and the phone app
# APK is attached. To release, bump "version" in manifest.json on main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HH_KEYSTORE_PASSWORD: ${{ secrets.HH_KEYSTORE_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Is this version new?
        id: check
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('custom_components/health_hub/manifest.json'))['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION is already released; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Signing key must open with the secret
        if: steps.check.outputs.new == 'true'
        run: |
          PW="$(printf '%s' "$HH_KEYSTORE_PASSWORD" | tr -d '[:space:]')"
          if [ -z "$PW" ]; then
            echo "::error::HH_KEYSTORE_PASSWORD secret is not set"; exit 1
          fi
          if [ "$PW" != "$HH_KEYSTORE_PASSWORD" ]; then
            echo "::warning::The secret had spaces or line breaks around it; they are ignored."
          fi
          if ! keytool -list -keystore android/signing/release.p12 -storetype PKCS12 -storepass "$PW" > /dev/null 2> keytool.err; then
            echo "::error::The signing key did not open with the secret (password length ${#PW}): $(tr '\n' ' ' < keytool.err | cut -c1-300)"
            exit 1
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.new == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Integration tests
        if: steps.check.outputs.new == 'true'
        run: pip install -r requirements_test.txt && pytest -q

      - uses: actions/setup-java@v5
        if: steps.check.outputs.new == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.new == 'true'
        with:
          gradle-version: "8.11.1"
      - name: Build signed phone app
        if: steps.check.outputs.new == 'true'
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease -PappVersion="$VERSION" 2>&1 | tee ../gradle.log

      - name: Show build errors
        if: failure()
        run: |
          [ -f gradle.log ] || exit 0
          grep -E "^e: |What went wrong|Caused by|> " gradle.log | head -25 | while IFS= read -r line; do
            echo "::error::${line:0:400}"
          done

      - name: Publish
        if: steps.check.outputs.new == 'true'
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "HealthHub-$VERSION.apk"
          printf '%s\n\n%s\n' \
            "**Home Assistant:** install or update Health Hub in HACS, then restart Home Assistant." \
            "**Phone:** download HealthHub-$VERSION.apk below on your phone and open it to install or update." \
            > notes.md
          gh release create "v$VERSION" "HealthHub-$VERSION.apk" \
            --target "$GITHUB_SHA" \
            --title "Health Hub $VERSION" \
            --notes-file notes.md \
            --latest
