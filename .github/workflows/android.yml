name: Phone app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HH_KEYSTORE_PASSWORD: ${{ secrets.HH_KEYSTORE_PASSWORD }}
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        working-directory: android
        run: gradle assembleRelease -PbuildNumber=${{ github.run_number }} --stacktrace

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/HealthHub-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: HealthHub-${{ env.VERSION }}
          path: out/*.apk

      - name: Signing key missing
        if: env.HH_KEYSTORE_PASSWORD == ''
        run: echo "::warning::HH_KEYSTORE_PASSWORD secret not set; built with a debug key and not published."

      - name: Publish to Releases
        if: env.HH_KEYSTORE_PASSWORD != '' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-v$VERSION" "out/HealthHub-$VERSION.apk" \
            --title "Phone app $VERSION" \
            --notes "Download HealthHub-$VERSION.apk on your phone and open it to install or update." \
            --latest
