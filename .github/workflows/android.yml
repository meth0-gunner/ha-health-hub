name: Phone app

# Checks that the app builds on every change. Releases are made by release.yml.
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease 2>&1 | tee ../gradle.log

      - name: Show build errors
        if: failure()
        run: |
          [ -f gradle.log ] || exit 0
          grep -E "^e: |What went wrong|Caused by|> " gradle.log | head -25 | while IFS= read -r line; do
            echo "::error::${line:0:400}"
          done
